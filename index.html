<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>월급시계 — 내 월급, 지금 얼마나 불었을까?</title>
<meta name="description" content="연봉을 입력하면 내 월급이 초단위·분단위로 실시간 쌓이는 걸 보여주는 월급 타이머">
<style>
  :root{
    --bg:#0f1226; --bg2:#1a1f3d; --card:rgba(255,255,255,.06);
    --accent:#ffd43b; --accent2:#4dabff; --text:#f1f3f9; --dim:#9aa3c0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#232a52 0%,var(--bg) 60%);
    color:var(--text); min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 48px; overflow-x:hidden;
  }
  h1{font-size:clamp(22px,5.5vw,32px); font-weight:800; letter-spacing:-.5px; margin-bottom:4px; text-align:center}
  h1 .coin{color:var(--accent)}
  .sub{color:var(--dim); font-size:14px; margin-bottom:24px; text-align:center}
  .panel{width:100%; max-width:520px; background:var(--card); border:1px solid rgba(255,255,255,.09);
    border-radius:20px; padding:20px; backdrop-filter:blur(6px)}
  label{display:block; font-size:13px; color:var(--dim); margin:0 0 6px 2px}
  .salary-row{display:flex; gap:8px; align-items:stretch}
  input[type=text]{
    flex:1; font-size:22px; font-weight:700; color:var(--text); background:rgba(0,0,0,.3);
    border:1.5px solid rgba(255,255,255,.14); border-radius:12px; padding:14px 16px; outline:none; text-align:right;
  }
  input[type=text]:focus{border-color:var(--accent)}
  .won{align-self:center; font-size:18px; color:var(--dim); white-space:nowrap}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .chip{font-size:12px; color:var(--dim); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    padding:6px 10px; border-radius:999px; cursor:pointer}
  .chip:active{transform:scale(.95)}
  .seg{display:flex; background:rgba(0,0,0,.3); border-radius:12px; padding:4px; margin-top:18px}
  .seg button{flex:1; padding:10px 4px; font-size:14px; font-weight:600; color:var(--dim); background:none;
    border:none; border-radius:9px; cursor:pointer; transition:.15s}
  .seg button.on{background:var(--bg2); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .seg-label{font-size:12px; color:var(--dim); margin:14px 0 0 2px}
  #startBtn{
    width:100%; margin-top:20px; padding:16px; font-size:18px; font-weight:800; color:#1a1a1a;
    background:linear-gradient(135deg,#ffd43b,#ffb700); border:none; border-radius:14px; cursor:pointer;
    box-shadow:0 6px 20px rgba(255,212,59,.25); transition:.15s;
  }
  #startBtn:active{transform:scale(.97)}
  #resetBtn{width:100%; margin-top:10px; padding:12px; font-size:14px; font-weight:600; color:var(--dim);
    background:none; border:1px solid rgba(255,255,255,.14); border-radius:12px; cursor:pointer; display:none}
  .basis{font-size:12px; color:var(--dim); margin-top:14px; line-height:1.6; text-align:center}

  #stage{display:none; width:100%; max-width:520px; text-align:center; position:relative}
  .rate-line{font-size:15px; color:var(--dim); margin-top:26px}
  .rate-line b{color:var(--accent2); font-size:17px}
  #counter{
    font-size:clamp(44px,12vw,72px); font-weight:900; letter-spacing:-1px; color:var(--accent);
    font-variant-numeric:tabular-nums; margin:10px 0 4px; text-shadow:0 0 40px rgba(255,212,59,.35);
    display:flex; justify-content:center; align-items:baseline; overflow:hidden; min-height:1.2em;
  }
  #counter .digit{display:inline-block; transition:transform .12s}
  #counter .bump{transform:translateY(-6px); color:#fff3bf}
  #elapsed{font-size:13px; color:var(--dim)}
  #fun{margin-top:26px; display:flex; flex-direction:column; gap:10px}
  .fun-item{background:var(--card); border:1px solid rgba(255,255,255,.09); border-radius:14px; padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center; font-size:15px}
  .fun-item .cnt{font-weight:800; color:var(--accent2); font-variant-numeric:tabular-nums}
  .basis2{font-size:11.5px; color:#6b7395; margin-top:20px; line-height:1.6}
  .coin-fall{position:fixed; top:-40px; font-size:22px; pointer-events:none; z-index:50;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.7}}
  footer{margin-top:auto; padding-top:36px; font-size:11px; color:#565e80; text-align:center; line-height:1.7}
</style>
</head>
<body>
  <h1><span class="coin">💰</span> 월급시계</h1>
  <p class="sub">연봉을 넣고 시작하면, 내 월급이 실시간으로 차오릅니다</p>

  <div class="panel" id="setup">
    <label for="salary">연봉 (세전, 원)</label>
    <div class="salary-row">
      <input type="text" id="salary" inputmode="numeric" placeholder="40,000,000" autocomplete="off">
      <span class="won">원</span>
    </div>
    <div class="chips">
      <span class="chip" data-v="30000000">3천만</span>
      <span class="chip" data-v="40000000">4천만</span>
      <span class="chip" data-v="50000000">5천만</span>
      <span class="chip" data-v="60000000">6천만</span>
      <span class="chip" data-v="80000000">8천만</span>
      <span class="chip" data-v="100000000">1억</span>
    </div>

    <div class="seg-label">환산 기준 (탭)</div>
    <div class="seg" id="modeSeg">
      <button data-mode="work" class="on">🕗 근무시간 기준</button>
      <button data-mode="all">🌏 시간 무관</button>
    </div>

    <div class="seg-label">표시 단위</div>
    <div class="seg" id="unitSeg">
      <button data-unit="sec" class="on">⚡ 초당</button>
      <button data-unit="min">⏱ 분당</button>
    </div>

    <button id="startBtn">시작하기 ▶</button>

    <p class="basis" id="basisText"></p>
  </div>

  <div id="stage">
    <p class="rate-line" id="rateLine"></p>
    <div id="counter"></div>
    <p id="elapsed"></p>
    <div id="fun"></div>
    <button id="resetBtn">↺ 다시 입력하기</button>
    <p class="basis2" id="basisText2"></p>
  </div>

  <footer>
    재미로 보는 단순 환산입니다. 세금·4대보험·상여·야근수당 등은 반영되지 않아요.<br>
    근무시간 기준: 월 소정근로시간 209시간(주 40시간) · 시간 무관: 월 30일×24시간
  </footer>

<script>
(function(){
  var salary=document.getElementById('salary'), startBtn=document.getElementById('startBtn'),
      resetBtn=document.getElementById('resetBtn'), setup=document.getElementById('setup'),
      stage=document.getElementById('stage'), counter=document.getElementById('counter'),
      rateLine=document.getElementById('rateLine'), elapsed=document.getElementById('elapsed'),
      fun=document.getElementById('fun'), basisText=document.getElementById('basisText'),
      basisText2=document.getElementById('basisText2');
  var mode='work', unit='sec', timer=null, t0=0, perSec=0, lastShown=-1, digitEls=[];

  var FUN=[{n:'아메리카노',p:4500,e:'☕'},{n:'넷플릭스 한 달',p:13500,e:'📺'},{n:'치킨 한 마리',p:20000,e:'🍗'},{n:'에어팟',p:199000,e:'🎧'}];

  function fmt(n){return n.toLocaleString('ko-KR')}
  function basis(){
    var s=mode==='work'
      ? '근무시간 기준: 연봉 ÷ 12개월 ÷ 209시간(주 40시간 법정 월 소정근로시간)으로 환산합니다.'
      : '시간 무관: 연봉 ÷ 12개월 ÷ 30일 ÷ 24시간 — 자는 시간까지 전부 쪼갠 환산입니다.';
    basisText.textContent=s; basisText2.textContent=s;
  }
  function parseSalary(){return parseInt(salary.value.replace(/[^0-9]/g,''),10)||0}

  salary.addEventListener('input',function(){
    var v=salary.value.replace(/[^0-9]/g,'');
    salary.value=v?fmt(parseInt(v,10)):'';
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click',function(){salary.value=fmt(parseInt(c.dataset.v,10));});
  });
  function segWire(id,cb){
    var seg=document.getElementById(id);
    seg.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
        b.classList.add('on'); cb(b.dataset);
      });
    });
  }
  segWire('modeSeg',function(d){mode=d.mode; basis();});
  segWire('unitSeg',function(d){unit=d.unit;});
  basis();

  function buildCounter(){
    counter.innerHTML=''; digitEls=[];
    var wrap=document.createElement('span'); wrap.className='digits'; counter.appendChild(wrap);
  }
  function renderCounter(val){
    var s=fmt(val), wrap=counter.firstChild;
    var cur=wrap.textContent;
    if(s===cur) return;
    wrap.innerHTML='';
    for(var i=0;i<s.length;i++){
      var d=document.createElement('span');
      d.className='digit'+(s[i]!==cur[i]?' bump':'');
      d.textContent=s[i];
      wrap.appendChild(d);
    }
  }
  function renderFun(total){
    var html='';
    FUN.forEach(function(f){
      var c=total/f.p;
      var txt=c>=1?fmt(Math.floor(c))+'개':(Math.floor(c*100)/100).toLocaleString('ko-KR')+'개';
      html+='<div class="fun-item"><span>'+f.e+' '+f.n+'</span><span class="cnt">'+txt+'</span></div>';
    });
    fun.innerHTML=html;
  }
  function dropCoin(){
    var c=document.createElement('div');
    c.className='coin-fall'; c.textContent=Math.random()<.5?'🪙':'💸';
    c.style.left=(8+Math.random()*84)+'vw';
    c.style.animationDuration=(1.2+Math.random()*1.2)+'s';
    document.body.appendChild(c);
    setTimeout(function(){c.remove()},2600);
  }
  function tick(){
    var dt=(Date.now()-t0)/1000;
    var total=perSec*dt;
    var shown=Math.floor(total);
    renderCounter(shown);
    if(shown>lastShown){
      lastShown=shown;
      var delta=shown-lastShown+1;
      if(shown>0 && shown%100<Math.max(1,perSec)) dropCoin();
    }
    var mm=Math.floor(dt/60), ss=Math.floor(dt%60);
    elapsed.textContent='시작 후 '+(mm>0?mm+'분 ':'')+ss+'초 경과';
    if(Math.floor(dt*2)!==renderFun._last){renderFun._last=Math.floor(dt*2); renderFun(total);}
  }

  startBtn.addEventListener('click',function(){
    var v=parseSalary();
    if(v<1000000){salary.focus(); salary.style.borderColor='#ff6b6b';
      setTimeout(function(){salary.style.borderColor=''},1200); return;}
    var perHour = mode==='work' ? v/12/209 : v/12/30/24;
    perSec = perHour/3600;
    var rate = unit==='sec' ? perSec : perSec*60;
    var rateTxt = rate>=100 ? fmt(Math.round(rate)) : rate.toFixed(rate>=1?1:2);
    rateLine.innerHTML=(unit==='sec'?'⚡ 초당 <b>':'⏱ 분당 <b>')+rateTxt+'원</b>씩 쌓이는 중';
    buildCounter(); renderCounter(0);
    setup.style.display='none'; stage.style.display='block';
    lastShown=-1; renderFun._last=-1;
    t0=Date.now();
    if(timer) clearInterval(timer);
    timer=setInterval(tick,50);
    window.scrollTo(0,0);
  });
  resetBtn.addEventListener('click',function(){
    if(timer) clearInterval(timer);
    stage.style.display='none'; setup.style.display='block';
  });
})();
</script>
</body>
</html>
